# git-cliff config: CHANGELOG.md is generated from the commit history (Conventional Commits).
# The in-app changelog is generated with this config at build time (scripts/changelogPlugin.ts)
# and parses this exact shape: keep "## [x.y.z] - date",
# "### Group" and "- item" lines if you change the template.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to Poo Game. Generated from the commit history by
[git-cliff](https://git-cliff.org); release with `pnpm release`.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# The 2022 history (v0.1.0) predates Conventional Commits; keep it under "Changes".
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
# The HTML comments only order the groups; the template strips them.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^(ci|build|chore)", group = "<!-- 6 -->Maintenance" },
  { message = "^Bump ", group = "<!-- 7 -->Dependencies" },
  { message = ".*", group = "<!-- 8 -->Changes" },
]
